<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IOMap 电气图核对</title><link rel="stylesheet" href="/static/style.css"></head><body>
<header><strong>IOMap</strong><span>电气图 → IO 清单 → 人工核对</span><a id="export" hidden>导出 Excel / Export</a></header>
<section class="upload"><form id="upload"><label>上传电气图 PDF<input type="file" name="file" accept="application/pdf" required></label><label>PDF页码范围（留空处理全部）<input name="pages" placeholder="例如 151-185"></label><label>OCR语言<input name="language" value="eng" title="需要本机安装对应Tesseract语言包，例如eng+ita"></label><label><input type="checkbox" name="force_ocr">强制OCR</label><button>上传并提取</button></form><label>已保存项目 <select id="projects"><option value="">选择项目</option></select></label></section>
<p id="message" role="status">数据保存在本机。识别结果是初稿，需要对照图纸核对。</p>
<main><section class="viewer"><div class="toolbar"><button id="prev">上一页</button><label>PDF页码 <input id="page" type="number" min="1" value="1"></label><button id="next">下一页</button><label>缩放<select id="zoom"><option value="100">100%</option><option value="150">150%</option><option value="200">200%</option><option value="300">300%</option></select></label><button id="add">补充本页记录</button></div><div class="viewport"><div class="imagewrap"><img id="drawing" alt="选择或上传PDF后显示原图"><div id="highlight" hidden></div></div></div></section>
<section class="results"><div class="toolbar"><input id="search" placeholder="搜索地址、设备或描述"><select id="filter"><option value="io">IO/端子记录</option><option value="devices">未关联设备候选</option><option value="all">全部记录</option><option value="pending">待核对</option><option value="page">当前PDF页</option></select><button id="translate">本地翻译中文</button></div><p id="stats"></p><details><summary>页面提取报告（检查遗漏与失败）</summary><div id="report"></div></details><div class="tablewrap"><table><thead><tr><th>地址 / Address</th><th>设备 / Device</th><th>原文描述 / Description</th><th>状态 / Status</th></tr></thead><tbody id="rows"></tbody></table></div>
<form id="editor" hidden><h3 id="recordtitle">核对记录</h3><div id="fields"></div><button type="submit">保存修改</button><button type="button" id="remove" class="danger">删除误识别项</button></form></section></main><script src="/static/app.js"></script></body></html>
